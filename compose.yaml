services:
  pinebound:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env to your permanent HTTPS origin}
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 20s
